<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 462" width="900" role="img" aria-label="IoT lab: what changed after hardening" font-family="Helvetica, Arial, sans-serif"><title>IoT lab: what changed after hardening</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2933"/></marker></defs><rect width="900" height="462" fill="#ffffff"/><text x="450" y="30" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle" >IoT lab: what changed after hardening</text><text x="40" y="58" font-size="12" font-weight="700" fill="#52606d" text-anchor="start" >Question</text><text x="380" y="58" font-size="12" font-weight="700" fill="#b42318" text-anchor="start" >Default configuration (baseline)</text><text x="640" y="58" font-size="12" font-weight="700" fill="#1a7f4b" text-anchor="start" >Hardened</text><rect x="30" y="68" width="840" height="38" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="1"/><text x="40" y="91" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start" >What an eavesdropper sees</text><text x="380" y="91" font-size="12" font-weight="400" fill="#b42318" text-anchor="start" >681 readable sensor readings, firmware in clear</text><text x="640" y="91" font-size="12" font-weight="400" fill="#1a7f4b" text-anchor="start" >0 readable, 1080 TLS records</text><rect x="30" y="112" width="840" height="38" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="1"/><text x="40" y="135" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start" >Outsider connecting to the broker</text><text x="380" y="135" font-size="12" font-weight="400" fill="#b42318" text-anchor="start" >Connects, reads every topic</text><text x="640" y="135" font-size="12" font-weight="400" fill="#1a7f4b" text-anchor="start" >TLS handshake refused, plain port closed</text><rect x="30" y="156" width="840" height="38" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="1"/><text x="40" y="179" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start" >Forged sensor readings (no credentials)</text><text x="380" y="179" font-size="12" font-weight="400" fill="#b42318" text-anchor="start" >15 of 15 stored</text><text x="640" y="179" font-size="12" font-weight="400" fill="#1a7f4b" text-anchor="start" >Cannot connect</text><rect x="30" y="200" width="840" height="38" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="1"/><text x="40" y="223" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start" >Stolen node2 certificate forging node1</text><text x="380" y="223" font-size="12" font-weight="400" fill="#b42318" text-anchor="start" >Not applicable (no identity)</text><text x="640" y="223" font-size="12" font-weight="400" fill="#1a7f4b" text-anchor="start" >Dropped by the ACL (0 stored)</text><rect x="30" y="244" width="840" height="38" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="1"/><text x="40" y="267" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start" >Unsigned or downgraded firmware</text><text x="380" y="267" font-size="12" font-weight="400" fill="#b42318" text-anchor="start" >Applied on the node</text><text x="640" y="267" font-size="12" font-weight="400" fill="#1a7f4b" text-anchor="start" >Rejected (signature, version check)</text><rect x="30" y="288" width="840" height="38" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="1"/><text x="40" y="311" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start" >Real sensor fault detection</text><text x="380" y="311" font-size="12" font-weight="400" fill="#b42318" text-anchor="start" >4 of 4 detected</text><text x="640" y="311" font-size="12" font-weight="400" fill="#1a7f4b" text-anchor="start" >4 of 4, 1 false alarm in 586 readings</text><text x="40" y="350" font-size="12" font-weight="700" fill="#b54708" text-anchor="start" >Not fixed by configuration (stated openly in the repository)</text><rect x="30" y="360" width="840" height="26" rx="6" fill="#fffaf0" stroke="#f0d9b5" stroke-width="1"/><text x="40" y="377" font-size="12" font-weight="600" fill="#1f2933" text-anchor="start" >A stolen key forging that device&#x27;s own topic</text><text x="380" y="377" font-size="12" font-weight="400" fill="#b54708" text-anchor="start" >Accepted by the broker; the detector caught 5 of 5 crude forgeries</text><rect x="30" y="390" width="840" height="26" rx="6" fill="#fffaf0" stroke="#f0d9b5" stroke-width="1"/><text x="40" y="407" font-size="12" font-weight="600" fill="#1f2933" text-anchor="start" >Subtle forgery (+0.8 degrees, valid sequence number)</text><text x="380" y="407" font-size="12" font-weight="400" fill="#b54708" text-anchor="start" >Not detected in either profile</text><text x="40" y="452" font-size="10.5" font-weight="400" fill="#52606d" text-anchor="start" >Detector numbers vary between runs; see the limits section of the README.</text></svg>